<!DOCTYPE html>
<html lang="en" data-theme="gold-night">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | Chronotales</title>
  <meta name="description" content="Get in touch with Chronotales — start your story, call us, or visit our studio." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./css/nav.css">
  <link rel="stylesheet" href="./css/footer.css">
  <link rel="stylesheet" href="./css/audio-modal.css">
  <link rel="stylesheet" href="./css/contact-modal.css">
  
  <style>
    :root{--color-accent:#d4a853;--color-accent-bright:#f4d36a;--color-accent-glow:rgba(212,168,83,.5);--color-bg-deep:#0b0b0c;--color-bg-surface:#111114;--color-bg-elevated:#18181c;--color-line:rgba(255,255,255,.08);--color-line-strong:rgba(255,255,255,.15);--color-text:#e8e6e1;--color-text-dim:rgba(232,230,225,.7);--color-text-muted:rgba(232,230,225,.45);--font-display:'Bebas Neue',sans-serif;--font-body:'Inter',system-ui,sans-serif;--radius-pill:100px;--radius-lg:16px;--radius-xl:24px;--ease-out-expo:cubic-bezier(.16,1,.3,1);--ease-standard:cubic-bezier(.4,0,.2,1);--dur-base:.3s;--dur-slow:.6s}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
    body{font-family:var(--font-body);background:var(--color-bg-deep);color:var(--color-text);min-height:100vh;overflow-x:hidden;line-height:1.6;letter-spacing:.01em}
    .contact-page{
  min-height:100vh;
  background:#0b0b0c;
  overflow-x:hidden;
}

.contact-main{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:96px 16px 40px;
}
    .contact-map-section{width:min(100%,1440px);display:flex;justify-content:center}
    .contact-map-wrapper{position:relative;width:100%;aspect-ratio:1440/900;border-radius:var(--radius-xl);overflow:hidden;border:1px solid var(--color-line);background:var(--color-bg-surface);box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 40px 80px rgba(0,0,0,.5);user-select:none}
    .contact-map__picture,.contact-map__bg{position:absolute;inset:0;width:100%;height:100%}
    .contact-map__bg{object-fit:cover;object-position:center center;z-index:1;pointer-events:none;display:block}
    .contact-map__svg-overlay{position:absolute;inset:0;z-index:2;pointer-events:none}
    .contact-map__svg-overlay svg{width:100%;height:100%;display:block;overflow:visible}
    .contact-map__svg-overlay .hit-area{pointer-events:auto;fill:rgba(0,0,0,.001)!important;stroke:transparent!important;cursor:pointer!important}
    .contact-map__indicators{position:absolute;inset:0;z-index:3;pointer-events:none}
    .contact-map__indicators>*{pointer-events:auto}
    @keyframes pulse-glow{0%,100%{box-shadow:0 0 8px var(--color-accent-glow),0 0 20px rgba(212,168,83,.25),0 0 40px rgba(212,168,83,.08);transform:translate(-50%,-50%) scale(1)}50%{box-shadow:0 0 16px var(--color-accent-bright),0 0 35px rgba(244,211,106,.45),0 0 70px rgba(244,211,106,.18);transform:translate(-50%,-50%) scale(1.12)}}
    @keyframes pulse-ring{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.5}50%{transform:translate(-50%,-50%) scale(1.8);opacity:0}}
    .glow-dot{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--color-accent);opacity:.85;z-index:4;cursor:pointer;animation:pulse-glow 2.4s ease-in-out infinite;transition:transform var(--dur-base) var(--ease-standard)}
    .glow-dot::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--color-accent);animation:pulse-ring 2.4s ease-in-out infinite;pointer-events:none}
    .glow-dot:hover{animation-play-state:paused;transform:translate(-50%,-50%) scale(1.15)!important;box-shadow:0 0 18px var(--color-accent-bright),0 0 32px rgba(244,211,106,.4),0 0 60px rgba(244,211,106,.18)!important}
    .glow-dot:active{transform:translate(-50%,-50%) scale(1.03)!important}
    .enquiry-text{position:absolute;font-family:var(--font-display);font-size:clamp(1.2rem,2.2vw,2rem);letter-spacing:.04em;text-transform:uppercase;color:var(--color-accent-bright);text-align:center;cursor:pointer;transition:all var(--dur-base) var(--ease-standard);text-shadow:0 0 30px rgba(212,168,83,.35);z-index:4;line-height:1.1;white-space:nowrap;max-width:90%;transform:translate(-50%,-50%)}
    .enquiry-text:hover{color:#fff;transform:translate(-50%,-50%) scale(1.03);text-shadow:0 0 28px rgba(244,211,106,.45)}
    .enquiry-text:active{transform:translate(-50%,-50%) scale(.97)}
    .whatsapp-icon-wrapper{position:absolute;z-index:4;cursor:pointer;transform:translate(-50%,-50%);transition:all var(--dur-base) var(--ease-standard)}
    .whatsapp-icon-wrapper svg{width:clamp(32px,4vw,48px);height:clamp(32px,4vw,48px);filter:drop-shadow(0 0 12px rgba(212,168,83,.4));transition:all var(--dur-base) var(--ease-standard);display:block}
    .whatsapp-icon-wrapper:hover svg{filter:drop-shadow(0 0 22px rgba(244,211,106,.7)) drop-shadow(0 0 44px rgba(244,211,106,.3));transform:scale(1.1)}
    .social-block{position:absolute;z-index:4;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);transition:filter var(--dur-base) var(--ease-standard)}
    .social-block:hover{filter:drop-shadow(0 0 25px rgba(212,168,83,.25))}
    .social-block__icons{display:flex;gap:clamp(.6rem,1.2vw,1rem);flex-wrap:wrap;justify-content:center}
    .social-icon{width:clamp(34px,4.5vw,48px);height:clamp(34px,4.5vw,48px);border-radius:50%;border:1px solid var(--color-line);background:rgba(255,255,255,.03);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--dur-base) var(--ease-standard);text-decoration:none;flex-shrink:0}
    .social-icon svg{width:50%;height:50%;fill:var(--color-accent);transition:all var(--dur-base) var(--ease-standard)}
    .social-icon:hover{border-color:var(--color-accent);background:rgba(244,211,106,.08);box-shadow:0 0 18px rgba(212,168,83,.35),0 0 40px rgba(212,168,83,.12);transform:translateY(-2px)}
    .social-icon:hover svg{fill:var(--color-accent-bright);filter:drop-shadow(0 0 6px rgba(244,211,106,.5))}
    .tooltip{position:absolute;z-index:10;pointer-events:none;opacity:0;transform:translate(-50%,-120%);transition:opacity var(--dur-base) var(--ease-standard),transform var(--dur-base) var(--ease-standard);background:var(--color-bg-elevated);color:var(--color-text);padding:.6rem 1rem;border-radius:8px;font-size:.8rem;font-weight:500;letter-spacing:.02em;white-space:nowrap;border:1px solid var(--color-line-strong);box-shadow:0 12px 32px rgba(0,0,0,.6);text-align:center}
    .tooltip::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%) rotate(45deg);width:10px;height:10px;background:var(--color-bg-elevated);border-right:1px solid var(--color-line-strong);border-bottom:1px solid var(--color-line-strong)}
    .tooltip.is-visible{opacity:1;transform:translate(-50%,-130%)}
    .tooltip--address{white-space:normal;min-width:180px;max-width:260px;line-height:1.5;font-size:.75rem;padding:.7rem 1rem}
    .modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.78);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:1.5rem;opacity:0;pointer-events:none;transition:opacity var(--dur-slow) var(--ease-out-expo)}
    .modal-overlay.is-open{opacity:1;pointer-events:auto}
    .modal{background:var(--color-bg-surface);border:1px solid var(--color-line-strong);border-radius:var(--radius-xl);padding:2.5rem 2rem;width:100%;max-width:520px;position:relative;box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 40px 80px rgba(0,0,0,.6);transform:translateY(20px);transition:transform var(--dur-slow) var(--ease-out-expo);max-height:90vh;overflow-y:auto}
    .modal-overlay.is-open .modal{transform:translateY(0)}
    .modal__close{position:absolute;top:1rem;right:1rem;width:40px;height:40px;border-radius:50%;border:1px solid var(--color-line);background:rgba(255,255,255,.03);color:var(--color-text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.4rem;transition:all var(--dur-base) var(--ease-standard)}
    .modal__title{font-family:var(--font-display);font-size:clamp(1.8rem,3vw,2.4rem);letter-spacing:.04em;text-transform:uppercase;color:var(--color-accent-bright);margin-bottom:.3rem;line-height:1}
    .modal__subtitle{font-size:.9rem;color:var(--color-text-muted);margin-bottom:1.8rem;letter-spacing:.02em}
    .form-field{display:flex;flex-direction:column;gap:.4rem;margin-bottom:1.2rem}
    .form-field label{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--color-text-dim)}
    .form-field input,.form-field textarea{padding:.75rem 1rem;border-radius:10px;border:1px solid var(--color-line);background:var(--color-bg-deep);color:var(--color-text);font:inherit;transition:all var(--dur-base) var(--ease-standard);resize:vertical;outline:none}
    .form-field input:focus,.form-field textarea:focus{border-color:var(--color-accent);box-shadow:0 0 0 3px rgba(212,168,83,.1);background:#141418}
    .form-field--honeypot{position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden}
    .form-error{font-size:.75rem;color:#e07060;display:none;margin-top:.15rem}
    .form-field.is-error .form-error{display:block}
    .form-field.is-error input,.form-field.is-error textarea{border-color:#e07060}
    .form-actions{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1.5rem}
    .btn{font:inherit;font-weight:600;font-size:.88rem;letter-spacing:.04em;text-transform:uppercase;padding:.8rem 1.6rem;border-radius:var(--radius-pill);cursor:pointer;border:1px solid transparent}
    .btn--primary{background:var(--color-accent);color:#0b0b0c;border-color:var(--color-accent);font-weight:700}
    .btn--secondary{background:transparent;color:var(--color-text-dim);border-color:var(--color-line)}
    .form-success{display:none;text-align:center;padding:2rem 1rem}
    .form-success.is-visible{display:block}
    .form-success__icon{font-size:3rem;margin-bottom:.8rem;display:block}
    .form-success__title{font-family:var(--font-display);font-size:1.8rem;letter-spacing:.04em;color:var(--color-accent-bright);margin-bottom:.5rem}
    .form-success__text{font-size:.9rem;color:var(--color-text-dim);line-height:1.6}
    .contact-map__picture {
    pointer-events: none;
    z-index: 1;
}

.contact-map__bg {
    pointer-events: none !important;
}

.contact-map__svg-overlay {
    pointer-events: none;
    z-index: 3; /* ensure above image ALWAYS */
}

.contact-map__svg-overlay .hit-area {
    pointer-events: all !important;
    cursor: pointer !important;
}
    @media (max-width:1024px){.contact-map-wrapper{aspect-ratio:1086/1448}.contact-map__bg{object-position:center top}.social-icon{width:80px;height:80px}}
    @media (max-width:480px){.contact-map-wrapper{aspect-ratio:864/1821;border-radius:12px}.contact-map__bg{object-position:center top}.glow-dot{width:14px;height:14px}.glow-dot::after{inset:-6px}.social-icon{width:30px;height:30px}.whatsapp-icon-wrapper svg{width:30px;height:30px}.enquiry-text{font-size:1.1rem}.tooltip{font-size:.7rem;padding:.5rem .75rem}.modal{padding:1.8rem 1.2rem;border-radius:var(--radius-lg)}}
  </style>
</head>

<script>
(function(){

  const svgContainer=document.getElementById('svgContainer');
  const glowTelephone=document.getElementById('glowTelephone');
  const glowPin=document.getElementById('glowPin');
  const enquiryText=document.getElementById('enquiryText');
  const whatsappIcon=document.getElementById('whatsappIcon');
  const socialBlock=document.getElementById('socialBlock');

  const tooltipTelephone=document.getElementById('tooltipTelephone');
  const tooltipWhatsapp=document.getElementById('tooltipWhatsapp');
  const tooltipPin=document.getElementById('tooltipPin');

  let currentBreakpoint='';
  let resizeTimer;

  const POSITIONS={
    desktop:{
      phone:{left:20.5,top:66.1}, pin:{left:80.86,top:51.72},
      enquiry:{left:48.9,top:56.3}, whatsapp:{left:68.5,top:60.5},
      social:{left:50.12,top:27.54},
      ttPhone:{left:20.5,top:63}, ttWhatsapp:{left:68.5,top:57.5}, ttPin:{left:80.86,top:46}
    },
    tablet:{
      phone:{left:19,top:66.4}, pin:{left:87.8,top:50.9},
      enquiry:{left:46.6,top:55.4}, whatsapp:{left:70.5,top:58},
      social:{left:50,top:26.2},
      ttPhone:{left:18.8,top:62.2}, ttWhatsapp:{left:70.5,top:54}, ttPin:{left:81.6,top:45}
    },
    mobile:{
      phone:{left:17.8,top:57.2}, pin:{left:82.6,top:69},
      enquiry:{left:49.8,top:57}, whatsapp:{left:83.1,top:52.3},
      social:{left:50.2,top:23.5},
      ttPhone:{left:22,top:53.5}, ttWhatsapp:{left:73.5,top:47.5}, ttPin:{left:73.5,top:62.5}
    }
  };

  function getBreakpoint(){
    const w=window.innerWidth;
    if(w<=480) return 'mobile';
    if(w<=1024) return 'tablet';
    return 'desktop';
  }

  function getTemplateId(bp){
    if(bp==='mobile') return 'svg-mobile';
    if(bp==='tablet') return 'svg-tablet';
    return 'svg-desktop';
  }

  function setPos(el,pos){
    if(!el || !pos) return;
    el.style.left=pos.left+'%';
    el.style.top=pos.top+'%';
  }

  function applyPositions(){
    const p=POSITIONS[getBreakpoint()];
    setPos(glowTelephone,p.phone);
    setPos(glowPin,p.pin);
    setPos(enquiryText,p.enquiry);
    setPos(whatsappIcon,p.whatsapp);
    setPos(socialBlock,p.social);
    setPos(tooltipTelephone,p.ttPhone);
    setPos(tooltipWhatsapp,p.ttWhatsapp);
    setPos(tooltipPin,p.ttPin);
  }

  function loadSVG(force){
    const bp=getBreakpoint();
    if(!force && bp===currentBreakpoint) return;

    currentBreakpoint=bp;

    const tpl=document.getElementById(getTemplateId(bp));
    if(!tpl || !svgContainer) return;

    svgContainer.innerHTML=tpl.innerHTML;
  }

  function showTooltip(el){ if(el) el.classList.add('is-visible'); }
  function hideTooltip(el){ if(el) el.classList.remove('is-visible'); }

  function attachHover(target,tooltip){
    if(!target || !tooltip) return;
    target.onmouseenter=()=>showTooltip(tooltip);
    target.onmouseleave=()=>hideTooltip(tooltip);
  }

  function openEnquiryModal(e){
    if(e) e.preventDefault();

    const modal = document.getElementById('enquiryModal');
    if(!modal) return;

    modal.classList.add('is-open');
    modal.setAttribute('aria-hidden','false');
    document.body.style.overflow='hidden';
  }

  function callAction(){ window.location.href='tel:9990543100'; }
  function whatsappAction(){ window.open('https://wa.me/919990543100','_blank'); }
  function pinAction(){ window.open('https://maps.app.goo.gl/Qh5r3hjx3DkLShPe8','_blank'); }

  function bindDynamic(){
    const telephone=document.getElementById('hit-telephone');
    const enquiry=document.getElementById('hit-enquiry');
    const whatsapp=document.getElementById('hit-whatsapp');
    const pin=document.getElementById('hit-pin');
    const social=document.getElementById('hit-social');

    attachHover(telephone,tooltipTelephone);
    attachHover(glowTelephone,tooltipTelephone);

    attachHover(whatsapp,tooltipWhatsapp);
    attachHover(whatsappIcon,tooltipWhatsapp);

    attachHover(pin,tooltipPin);
    attachHover(glowPin,tooltipPin);

    if(telephone) telephone.onclick=callAction;
    if(glowTelephone) glowTelephone.onclick=callAction;

    if(whatsapp) whatsapp.onclick=whatsappAction;
    if(whatsappIcon) whatsappIcon.onclick=whatsappAction;

    if(pin) pin.onclick=pinAction;
    if(glowPin) glowPin.onclick=pinAction;

    if(enquiry) enquiry.onclick=openEnquiryModal;
    if(enquiryText) enquiryText.onclick=openEnquiryModal;
  }

  function hydrate(force){
    loadSVG(force);
    applyPositions();

    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        bindDynamic();
        document.body.style.cursor='default';
      });
    });
  }

  // 🔥 IMPORTANT FIX (ROOT ISSUE)
  document.addEventListener('chronotales:partials-loaded', ()=>{
    hydrate(true);
  });

  window.addEventListener('resize',()=>{
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>{
      const force=getBreakpoint()!==currentBreakpoint;
      hydrate(force);
    },180);
  });

})();
</script>
