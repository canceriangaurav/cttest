<div class="ct-audio-modal" id="audioPermissionModal" aria-hidden="true">
  <div class="ct-audio-modal__backdrop" id="audioPermissionBackdrop"></div>

  <div
    class="ct-audio-modal__dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="audioPermissionTitle"
    aria-describedby="audioPermissionText"
  >
    <h2 class="ct-audio-modal__title" id="audioPermissionTitle">Enable sound?</h2>
    <p class="ct-audio-modal__text" id="audioPermissionText">
      This experience includes ambient and scene-based audio.
    </p>

    <div class="ct-audio-modal__actions">
      <button type="button" class="ct-audio-modal__button ct-audio-modal__button--secondary" id="audioPermissionNo">
        No
      </button>
      <button type="button" class="ct-audio-modal__button ct-audio-modal__button--primary" id="audioPermissionYes">
        Yes
      </button>
    </div>
  </div>
</div>
