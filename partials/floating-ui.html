<div class="ct-floating-ui">
  <button
    id="backToTop"
    class="ct-floating-btn ct-back-to-top"
    type="button"
    aria-label="Back to top"
    title="Back to top"
  >
    <span aria-hidden="true">↑</span>
  </button>

  <button
    class="ct-floating-btn ct-sound-toggle"
    id="soundToggle"
    type="button"
    aria-pressed="false"
    aria-label="Sound off"
  >
    <span class="ct-sound-toggle__icon">🔇</span>
  </button>
</div>
